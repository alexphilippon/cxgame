name: Sonde X²O et HG Cross
# Lancement manuel : onglet Actions > « Sonde X²O et HG Cross » > Run workflow.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils >/dev/null
      - run: python3 tools/probe-series.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "cxgame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/probe
          git diff --cached --quiet || (git commit -m "Sonde X²O Trofee et HG Cross (pages brutes)" && git pull --rebase -q && git push)
