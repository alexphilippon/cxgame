name: Sonde des sources
# Lancement manuel : onglet Actions > « Sonde des sources » > Run workflow. Enregistre dans data/raw/probe2 le début des pages de résultats cyclo-cross.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/probe-sources.sh
      - name: Enregistrer
        run: |
          git config user.name "cxgame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/probe2
          git diff --cached --quiet || (git commit -m "Sonde des sources de résultats" && git push)
