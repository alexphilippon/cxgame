name: Sonde 4
# Lancement manuel : onglet Actions > « Sonde 4 » > Run workflow.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo true
      - run: python3 tools/probe4.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "cxgame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/probe4
          git diff --cached --quiet || (git commit -m "Sonde 4 (API résultats)" && git pull --rebase -q && git push)
