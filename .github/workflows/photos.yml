name: Photos des coureurs
# Lancement manuel : onglet Actions > « Photos des coureurs » > Run workflow.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save sharp
      - run: node tools/fetch-wikidata-photos.js
      - name: Enregistrer les photos
        run: |
          git config user.name "cxgame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add img/athletes tools/photo-credits.json credits.html
          git diff --cached --quiet || (git commit -m "Photos des coureurs (Wikimedia Commons)" && git push)
