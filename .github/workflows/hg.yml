name: Résultats HG Cross
# À la demande (Actions > « Résultats HG Cross » > Run workflow) et chaque jour à 20h UTC : classements via l'API Chronorace / ACN Timing.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'
permissions:
  contents: write
jobs:
  hg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch-hg.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "cxgame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/hg
          git diff --cached --quiet || (git commit -m "Résultats HG Cross (relevé automatique)" && git pull --rebase -q && git push)
