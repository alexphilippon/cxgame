name: Résultats autres séries
# Lancement manuel : onglet Actions > « Résultats autres séries » > Run workflow. Superprestige et HG Cross.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  series:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils >/dev/null
      - run: python3 tools/fetch-series.py 2025-2026
      - name: Enregistrer
        run: |
          git config user.name "cxgame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/series
          git diff --cached --quiet || (git commit -m "Résultats autres séries 2025-2026 (texte brut des PDF officiels)" && git push)
