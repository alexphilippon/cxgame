name: Start lists
# Toutes les 30 minutes (et à la demande : Actions > « Start lists » > Run workflow). Lit les PDF listés dans data/startlist-sources.json.
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
jobs:
  startlists:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils >/dev/null
      - run: python3 tools/fetch-startlists.py
      - name: Enregistrer
        run: |
          git config user.name "cxgame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/startlists.json data/raw/startlists
          git diff --cached --quiet -- data/startlists.json || (git commit -m "Start lists mises à jour (relevé automatique)" && git pull --rebase -q && git push)
