name: Sonde 2
# Lancement manuel : onglet Actions > « Sonde 2 » > Run workflow.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils >/dev/null
      - run: python3 tools/probe2.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "cxgame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/probe2
          git diff --cached --quiet || (git commit -m "Sonde 2 (API ACN, pages X²O)" && git pull --rebase -q && git push)
